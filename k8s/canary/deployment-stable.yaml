# ─────────────────────────────────────────────────────────────────────────────
# Canary Deployment — STABLE (90 % of traffic)
#
# STRATEGY:
#   Both stable and canary pods share the same Service selector (app=aceest-fitness).
#   Traffic split is proportional to replica count:
#     stable  = 9 replicas  → ~90% traffic
#     canary  = 1 replica   → ~10% traffic
#   Monitor metrics → if canary is healthy, scale canary up and stable down
#   → eventually replace stable with canary image.
#
# USAGE:
#   kubectl apply -f k8s/canary/deployment-stable.yaml
#   kubectl apply -f k8s/canary/deployment-canary.yaml
#   kubectl apply -f k8s/canary/service.yaml
#   # Monitor → then promote:
#   kubectl set image deployment/aceest-fitness-stable \
#     aceest-fitness=nehaRTonpe/aceest-fitness:3.2.5 -n aceest-fitness
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: stable
    version: "3.2.4"
spec:
  replicas: 9                     # ← 90% of traffic via replica weighting
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
        version: "3.2.4"
    spec:
      containers:
        - name: aceest-fitness
          image: nehaRTonpe/aceest-fitness:3.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: aceest-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
