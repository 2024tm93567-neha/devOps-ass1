# ─────────────────────────────────────────────────────────────────────────────
# Canary Service — selects ALL pods with app=aceest-fitness
# Traffic distribution = proportional to replica count (9 stable : 1 canary)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-svc
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
  annotations:
    deployment-strategy: canary
spec:
  type: NodePort
  selector:
    app: aceest-fitness            # ← matches BOTH stable and canary pods
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30081
