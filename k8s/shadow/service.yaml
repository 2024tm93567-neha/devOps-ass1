# ─────────────────────────────────────────────────────────────────────────────
# Shadow Services — two separate services so traffic mirroring can target each
#
# With Istio VirtualService + HTTPMirror, production traffic is sent to
# aceest-fitness-prod-svc, and a mirror copy goes to aceest-fitness-shadow-svc.
# ─────────────────────────────────────────────────────────────────────────────
# Production Service — receives real traffic
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-prod-svc
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: production
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    track: production
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30083
---
# Shadow Service — receives mirrored copy of traffic (responses discarded)
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-svc
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: shadow
  annotations:
    deployment-strategy: shadow
spec:
  type: ClusterIP                 # shadow need not be externally reachable
  selector:
    app: aceest-fitness
    track: shadow
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
---
# ── Istio VirtualService for traffic mirroring (requires Istio installed) ───
