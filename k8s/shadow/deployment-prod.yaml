# ─────────────────────────────────────────────────────────────────────────────
# Shadow Deployment — PRODUCTION (serves real users)
#
# STRATEGY:
#   Production pods handle all live traffic normally.
#   An identical "shadow" deployment receives a mirrored copy of every request
#   (via Istio traffic mirroring or Nginx mirroring), but its responses are
#   discarded — users never see shadow responses.
#   This validates the new version under real load with zero user risk.
#
# PREREQUISITE: Istio service mesh OR nginx-ingress with mirror annotation.
#
# USAGE:
#   kubectl apply -f k8s/shadow/deployment-prod.yaml
#   kubectl apply -f k8s/shadow/deployment-shadow.yaml
#   kubectl apply -f k8s/shadow/service.yaml
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-prod
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    track: production
    version: "3.2.4"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      track: production
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: production
        version: "3.2.4"
    spec:
      containers:
        - name: aceest-fitness
          image: nehartonpe/aceest-fitness:3.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: aceest-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
