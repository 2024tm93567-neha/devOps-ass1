# ─────────────────────────────────────────────────────────────────────────────
# A/B Testing — Variant B (Experiment Group — new version / feature)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-variant-b
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
    variant: b
    version: "3.2.5"
    ab-test: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness
      variant: b
  template:
    metadata:
      labels:
        app: aceest-fitness
        variant: b
        version: "3.2.5"
    spec:
      containers:
        - name: aceest-fitness
          image: nehartonpe/aceest-fitness:3.2.5    # ← Variant B (experiment)
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: AB_VARIANT
              value: "B"
          envFrom:
            - configMapRef:
                name: aceest-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          emptyDir: {}
