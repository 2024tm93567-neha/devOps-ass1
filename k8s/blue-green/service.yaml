# ─────────────────────────────────────────────────────────────────────────────
# Blue-Green Service — routes traffic to whichever slot is active
#
# To switch to GREEN:
#   kubectl patch service aceest-fitness-svc \
#     -n aceest-fitness \
#     -p '{"spec":{"selector":{"app":"aceest-fitness","slot":"green"}}}'
#
# To rollback to BLUE:
#   kubectl patch service aceest-fitness-svc \
#     -n aceest-fitness \
#     -p '{"spec":{"selector":{"app":"aceest-fitness","slot":"blue"}}}'
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-svc
  namespace: aceest-fitness
  labels:
    app: aceest-fitness
  annotations:
    deployment-strategy: blue-green
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    slot: blue                    # ← initially points to BLUE (stable)
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
