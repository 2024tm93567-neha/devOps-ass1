# ─────────────────────────────────────────────────────────────────────────────
# ACEest Fitness & Gym — GitHub Actions CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────

name: ACEest CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Build & Lint
  # ────────────────────────────────────────────────────────────────────────────
  build-and-lint:
    name: "Stage 1 · Build & Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          echo "▶ Running flake8 on app.py..."
          flake8 app.py \
            --max-line-length=100 \
            --ignore=E501,W391,W503,W504
          echo "▶ Running flake8 on tests/..."
          flake8 tests/ \
            --max-line-length=100 \
            --ignore=E501,W391,W503,W504
          echo "✅ Lint passed — no syntax errors detected."

      - name: Verify application imports cleanly
        run: |
          python -c "from app import create_app, calculate_bmi, calculate_calories, PROGRAMS; print('✅ Import check passed')"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Docker Image Assembly
  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "Stage 2 · Docker Image Assembly"
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "▶ Building Docker image: aceest-fitness:${{ github.sha }}"
          docker build \
            --tag aceest-fitness:${{ github.sha }} \
            --tag aceest-fitness:latest \
            .
          echo "✅ Docker image built successfully."

      - name: Inspect image metadata
        run: |
          docker inspect aceest-fitness:${{ github.sha }} \
            --format '{{.Id}} | Size: {{.Size}} bytes'

      - name: Verify HEALTHCHECK is configured
        run: |
          docker inspect aceest-fitness:${{ github.sha }} \
            --format '{{json .Config.Healthcheck}}' | grep -q "curl"
          echo "✅ HEALTHCHECK probe verified."

      - name: Save image as artifact (for downstream jobs)
        run: |
          docker save aceest-fitness:${{ github.sha }} \
            | gzip > /tmp/aceest-fitness-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/aceest-fitness-image.tar.gz
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 — Automated Testing inside Docker
  # ────────────────────────────────────────────────────────────────────────────
  automated-tests:
    name: "Stage 3 · Automated Testing"
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/aceest-fitness-image.tar.gz
          echo "✅ Docker image loaded."

      - name: Run pytest suite inside Docker container
        run: |
          echo "▶ Executing pytest inside Docker container..."
          docker run --rm \
            --name aceest-test-runner \
            aceest-fitness:${{ github.sha }} \
            python -m pytest tests/ \
              --verbose \
              --tb=short \
              --color=yes \
              -p no:cacheprovider
          echo "✅ All tests passed."

      - name: Run pytest with JUnit XML report
        if: always()
        run: |
          docker run --rm \
            --name aceest-test-junit \
            --volume "${{ github.workspace }}:/workspace" \
            aceest-fitness:${{ github.sha }} \
            python -m pytest tests/ \
              --junitxml=/workspace/test-results.xml \
              -q \
              -p no:cacheprovider || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: test-results.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4 — Pipeline Summary (always runs)
  # ────────────────────────────────────────────────────────────────────────────
  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [build-and-lint, docker-build, automated-tests]
    if: always()

    steps:
      - name: Print pipeline outcome
        run: |
          echo "╔══════════════════════════════════════════════╗"
          echo "║      ACEest Fitness — CI/CD Pipeline Done    ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Commit : ${{ github.sha }}"
          echo "║  Branch : ${{ github.ref_name }}"
          echo "║  Actor  : ${{ github.actor }}"
          echo "╚══════════════════════════════════════════════╝"
