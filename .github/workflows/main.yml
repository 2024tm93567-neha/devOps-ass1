# ─────────────────────────────────────────────────────────────────────────────
# ACEest Fitness & Gym — GitHub Actions CI/CD Pipeline (Assignment 2)
#
# Jobs:
#   1. build-and-lint  → Python lint (flake8) + SonarQube analysis
#   2. docker-build    → Build Docker image, run tests inside, smoke test
#   3. push-registry   → Push versioned images to Docker Hub
#   4. pipeline-summary → Report pass/fail outcome
#
# Secrets required (configure in GitHub → Settings → Secrets):
#   DOCKERHUB_USERNAME   → your Docker Hub username
#   DOCKERHUB_TOKEN      → Docker Hub access token (not password)
#   SONAR_TOKEN          → SonarQube project auth token
#   SONAR_HOST_URL       → http://your-sonarqube-host:9000
# ─────────────────────────────────────────────────────────────────────────────
name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/*", "feature/*"]
    tags:     ["v*"]
  pull_request:
    branches: [main]

env:
  APP_NAME:      aceest-fitness
  APP_VERSION:   "3.2.4"
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_BASE:    ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness

# ── Job 1: Build & Lint ───────────────────────────────────────────────────────
jobs:
  build-and-lint:
    name: Build, Lint & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history needed for SonarQube blame

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app.py tests/ \
            --max-line-length=100 \
            --ignore=E501,W503,W504 \
            --statistics
          echo "✅ Lint passed"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --tb=short \
            --color=yes

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=aceest-fitness
            -Dsonar.projectName="ACEest Fitness & Gym"
            -Dsonar.projectVersion=${{ env.APP_VERSION }}
            -Dsonar.sources=.
            -Dsonar.inclusions=app.py
            -Dsonar.exclusions=tests/**,.venv/**,k8s/**,scripts/**
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

# ── Job 2: Docker Build + Test ────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: build-and-lint

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=build-${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
            --tag ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }} \
            --tag ${{ env.IMAGE_BASE }}:build-${{ github.run_number }} \
            .

      - name: Run pytest inside Docker
        run: |
          docker run --rm \
            --name aceest-test-${{ github.run_number }} \
            --env DATABASE_URL=/tmp/test.db \
            ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }} \
            python -m pytest tests/ \
              --verbose \
              --tb=short \
              --color=no \
              -p no:cacheprovider

      - name: Smoke test (live container)
        run: |
          docker run -d \
            --name aceest-smoke-${{ github.run_number }} \
            -p 5099:5000 \
            --env DATABASE_URL=/tmp/smoke.db \
            ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }}

          sleep 8

          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            http://localhost:5099/api/health || echo "000")

          docker stop aceest-smoke-${{ github.run_number }} || true
          docker rm   aceest-smoke-${{ github.run_number }} || true

          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test failed — HTTP $STATUS"
            exit 1
          fi
          echo "✅ Smoke test passed — HTTP $STATUS"

      - name: Save Docker image as tarball
        run: |
          docker save ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }} \
            | gzip > aceest-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: aceest-image.tar.gz
          retention-days: 1

# ── Job 3: Push to Docker Hub ─────────────────────────────────────────────────
  push-registry:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c aceest-image.tar.gz | docker load

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push version tag
        run: |
          docker push ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }}
          docker tag  ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }} \
                      ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:latest
          echo "✅ Pushed ${{ env.IMAGE_BASE }}:${{ env.APP_VERSION }}"
          echo "✅ Pushed ${{ env.IMAGE_BASE }}:latest"

      - name: Push all historical versions (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash scripts/push-versions.sh

# ── Job 4: Pipeline Summary ───────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-lint, docker-build, push-registry]
    if: always()

    steps:
      - name: Print pipeline outcome
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  ACEest Fitness CI/CD Pipeline — SUMMARY                 ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Build & Lint  : ${{ needs.build-and-lint.result }}"
          echo "║  Docker Build  : ${{ needs.docker-build.result }}"
          echo "║  Push Registry : ${{ needs.push-registry.result }}"
          echo "╚══════════════════════════════════════════════════════════╝"
