# ─────────────────────────────────────────────────────────────────────────────
# SonarQube Project Configuration — ACEest Fitness & Gym
# Used by: sonar-scanner CLI (Jenkins pipeline Stage 4 + local dev)
#
# Local usage:
#   sonar-scanner -Dsonar.login=<your-token>
# ─────────────────────────────────────────────────────────────────────────────

# Project identity
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.projectVersion=3.2.4
sonar.organization=aceest-devops

# Source settings
sonar.sources=.
sonar.inclusions=app.py
sonar.exclusions=**/*.db,**/__pycache__/**,**/.venv/**,**/node_modules/**,tests/**,.github/**,k8s/**,scripts/**,reports/**

# Test settings
sonar.tests=tests
sonar.test.inclusions=tests/test_*.py

# Python language
sonar.language=python

# Coverage report (generated by pytest-cov in pipeline)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate — fail build if:
#   • Reliability Rating worse than A
#   • Security Rating worse than A
#   • Maintainability Rating worse than A
#   • Coverage < 70%
#   • Duplicated Lines > 5%
# (Configure thresholds in SonarQube UI under Quality Gates)

# SonarQube Server URL (override from Jenkins SONAR_HOST_URL env var)
# sonar.host.url=http://localhost:9000

# Links
sonar.links.scm=https://github.com/nehaRTonpe/aceest-fitness
sonar.links.ci=http://localhost:8080/job/aceest-fitness/
